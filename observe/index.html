<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Observe | BranBed</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      transition:
        background-color 0.8s ease,
        color 0.8s ease;
    }

    /* =========================
       Day / Night
       ========================= */

    body.day {
      background-color: white;
      color: black;
    }

    body.night {
      background-color: black;
      color: white;
    }

    /* =========================
       Scene
       =========================

       背景画像とUIを
       同じ座標系で扱う領域。

       PC:
       最大1536px

       スマホ:
       画面幅に合わせて縮小
    */

    .scene {
      position: relative;

      width: min(1536px, 100vw);
      aspect-ratio: 3 / 2;

      margin: 0 auto;

      overflow: hidden;

      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% 100%;
    }

    body.day .scene {
      background-image:
        url("../assets/background-observe-day.jpg");
    }

    body.night .scene {
      background-image:
        url("../assets/background-observe-night.jpg");
    }

    /* =========================
       Page brand
       ========================= */

    .page-brand {
      position: absolute;

      left: 3.5%;
      top: 3.5%;

      z-index: 30;
    }

    .brand-home {
      display: inline-block;

      color: inherit;
      text-decoration: none;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(18px, 2vw, 30px);

      font-weight: 400;

      line-height: 1.1;

      transition:
        opacity 0.2s ease;
    }

    .page-name {
      margin-top: 4px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(11px, 1.1vw, 16px);

      font-weight: 400;

      line-height: 1.2;

      opacity: 0.75;
    }

    body.day .page-brand {
      color: black;
    }

    body.night .page-brand {
      color: white;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55);
    }

    @media (hover: hover) and (pointer: fine) {
      .brand-home:hover {
        opacity: 0.6;
      }
    }

    /* =========================
       Bottom menu
       ========================= */

    .observe-menu {
      position: absolute;

      left: 50%;
      bottom: 3.2%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: clamp(24px, 5vw, 72px);

      z-index: 20;
    }

    .observe-menu button {
      appearance: none;

      margin: 0;
      padding: 6px 4px;

      border: 0;
      background: transparent;

      font: inherit;
      font-size: clamp(12px, 1.45vw, 22px);
      font-weight: 400;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    body.day .observe-menu button {
      color: black;
    }

    body.night .observe-menu button {
      color: white;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .observe-menu button[aria-pressed="true"] {
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    @media (hover: hover) and (pointer: fine) {
      .observe-menu button:hover {
        opacity: 0.65;
        transform: translateY(-1px);
      }
    }

    /* =========================
       Overlay area
       ========================= */

    .overlay {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 7%;

      box-sizing: border-box;

      z-index: 10;

      pointer-events: none;

      opacity: 0;

      transition:
        opacity 0.25s ease;
    }

    .overlay.is-open {
      pointer-events: auto;
      opacity: 1;
    }

    /* =========================
       Content panel
       ========================= */

    .content-panel {
      position: relative;

      width: min(720px, 82%);
      max-height: 68%;

      overflow-y: auto;

      box-sizing: border-box;

      padding:
        clamp(22px, 3vw, 42px);

      border-radius: 14px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        background-color 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease;
    }

    body.day .content-panel {
      background:
        rgba(255, 255, 255, 0.78);

      color: black;

      border:
        1px solid rgba(0, 0, 0, 0.15);
    }

    body.night .content-panel {
      background:
        rgba(0, 0, 0, 0.68);

      color: white;

      border:
        1px solid rgba(255, 255, 255, 0.22);
    }

    /* =========================
       Panel title
       ========================= */

    .panel-title {
      margin:
        0 40px 22px 0;

      font-size:
        clamp(20px, 2vw, 30px);

      font-weight: 400;
    }

    /* =========================
       Content list
       ========================= */

    .content-list {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    .content-list li + li {
      margin-top: 13px;
    }

    .content-list a {
      display: inline-block;

      color: inherit;
      text-decoration: none;

      font-size:
        clamp(13px, 1.25vw, 18px);

      line-height: 1.5;

      transition:
        opacity 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .content-list a:hover {
        opacity: 0.58;
      }
    }

    /* =========================
       Empty state
       ========================= */

    .empty-message {
      margin: 0;

      font-size:
        clamp(13px, 1.15vw, 17px);

      line-height: 1.7;

      opacity: 0.7;
    }

    /* =========================
       Close button
       ========================= */

    .close-panel {
      position: absolute;

      top: 14px;
      right: 16px;

      width: 36px;
      height: 36px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;

      color: inherit;

      font-family:
        Arial,
        sans-serif;

      font-size: 25px;
      font-weight: 300;
      line-height: 1;

      cursor: pointer;

      opacity: 0.65;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .close-panel:hover {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    /* =========================
       Keyboard focus
       ========================= */

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 600px) {

      .page-brand {
        left: 3%;
        top: 3%;
      }

      .brand-home {
        font-size: 18px;
      }

      .page-name {
        font-size: 11px;
      }

      .observe-menu {
        bottom: 2.5%;

        gap: 28px;
      }

      .observe-menu button {
        font-size: 12px;
      }

      .overlay {
        padding:
          10% 5% 14%;
      }

      .content-panel {
        width: 92%;
        max-height: 70%;

        padding:
          22px 20px;
      }

      .panel-title {
        font-size: 19px;
      }

      .content-list a {
        font-size: 14px;
      }
    }

    /* =========================
       Reduced motion
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <!-- =======================
         BranBed / Observe
         ======================= -->

    <header class="page-brand">

      <a
        class="brand-home"
        href="../index.html"
      >
        BranBed
      </a>

      <div class="page-name">
        Observe
      </div>

    </header>

    <!-- =======================
         Floating content window
         ======================= -->

    <div
      class="overlay"
      id="overlay"
      aria-hidden="true"
    >

      <section
        class="content-panel"
        role="dialog"
        aria-modal="false"
        aria-labelledby="panel-title"
      >

        <button
          class="close-panel"
          id="close-panel"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

        <h1
          class="panel-title"
          id="panel-title"
        >
        </h1>

        <div
          id="panel-content"
        >
        </div>

      </section>

    </div>

    <!-- =======================
         Bottom navigation
         ======================= -->

    <nav
      class="observe-menu"
      aria-label="Observe sections"
    >

      <button
        type="button"
        data-section="sonar"
        aria-pressed="false"
      >
        Sonar
      </button>

      <button
        type="button"
        data-section="current"
        aria-pressed="false"
      >
        Current
      </button>

      <button
        type="button"
        data-section="dive"
        aria-pressed="false"
      >
        Dive
      </button>

    </nav>

  </main>

  <script>

    /* =========================
       Day / Night
       ========================= */

    function setTheme() {

      const now =
        new Date();

      const hour =
        now.getHours();

      const isDaytime =
        hour >= 6 &&
        hour < 18;

      document.body.classList.toggle(
        "day",
        isDaytime
      );

      document.body.classList.toggle(
        "night",
        !isDaytime
      );

    }

    setTheme();

    /*
      ページを開いたまま
      06:00 / 18:00 を迎えた場合も
      自動的に切り替える
    */

    setInterval(
      setTheme,
      60 * 1000
    );


    /* =========================
       Observe contents

       今後の記事追加は
       基本的にここを編集します。
       ========================= */

    const observeContents = {

      sonar: {
        title: "Sonar",

        items: [
          /*
          例:

          {
            title: "JPY Carry",
            href: "./sonar/jpy-carry/"
          },

          {
            title: "CHF Flow",
            href: "./sonar/chf-flow/"
          }
          */
        ]
      },

      current: {
        title: "Current",

        items: [
          /*
          例:

          {
            title: "USD Liquidity",
            href: "./current/usd-liquidity/"
          }
          */
        ]
      },

      dive: {
        title: "Dive",

        items: [
          /*
          例:

          {
            title: "FX Swap Market",
            href: "./dive/fx-swap-market/"
          }
          */
        ]
      }

    };


    /* =========================
       Panel control
       ========================= */

    const overlay =
      document.getElementById(
        "overlay"
      );

    const panelTitle =
      document.getElementById(
        "panel-title"
      );

    const panelContent =
      document.getElementById(
        "panel-content"
      );

    const closePanelButton =
      document.getElementById(
        "close-panel"
      );

    const menuButtons =
      document.querySelectorAll(
        ".observe-menu button"
      );


    function openPanel(sectionKey) {

      const section =
        observeContents[
          sectionKey
        ];

      if (!section) {
        return;
      }

      panelTitle.textContent =
        section.title;

      panelContent.innerHTML =
        "";

      /*
        コンテンツがまだない場合
      */

      if (
        !section.items ||
        section.items.length === 0
      ) {

        const message =
          document.createElement(
            "p"
          );

        message.className =
          "empty-message";

        message.textContent =
          "No content yet.";

        panelContent.appendChild(
          message
        );

      } else {

        const list =
          document.createElement(
            "ul"
          );

        list.className =
          "content-list";

        section.items.forEach(
          item => {

            const listItem =
              document.createElement(
                "li"
              );

            const link =
              document.createElement(
                "a"
              );

            link.href =
              item.href;

            link.textContent =
              item.title;

            listItem.appendChild(
              link
            );

            list.appendChild(
              listItem
            );

          }
        );

        panelContent.appendChild(
          list
        );

      }

      menuButtons.forEach(
        button => {

          const isActive =
            button.dataset.section ===
            sectionKey;

          button.setAttribute(
            "aria-pressed",
            isActive
              ? "true"
              : "false"
          );

        }
      );

      overlay.classList.add(
        "is-open"
      );

      overlay.setAttribute(
        "aria-hidden",
        "false"
      );

    }


    function closePanel() {

      overlay.classList.remove(
        "is-open"
      );

      overlay.setAttribute(
        "aria-hidden",
        "true"
      );

      menuButtons.forEach(
        button => {

          button.setAttribute(
            "aria-pressed",
            "false"
          );

        }
      );

    }


    /* =========================
       Menu button events
       ========================= */

    menuButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const sectionKey =
              button.dataset.section;

            /*
              開いているカテゴリを
              もう一度押した場合は閉じる
            */

            const alreadyActive =
              button.getAttribute(
                "aria-pressed"
              ) === "true" &&
              overlay.classList.contains(
                "is-open"
              );

            if (alreadyActive) {

              closePanel();

            } else {

              openPanel(
                sectionKey
              );

            }

          }
        );

      }
    );


    /* =========================
       Close button
       ========================= */

    closePanelButton.addEventListener(
      "click",
      closePanel
    );


    /* =========================
       Escape key
       ========================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlay.classList.contains(
            "is-open"
          )
        ) {

          closePanel();

        }

      }
    );

  </script>

</body>
</html>

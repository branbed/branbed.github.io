<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore | BranBed</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      transition:
        background-color 0.8s ease,
        color 0.8s ease;
    }

    /* =========================
       Day / Night
       ========================= */

    body.day {
      background-color: white;
      color: black;
    }

    body.night {
      background-color: black;
      color: white;
    }

    /* =========================
       Scene
       ========================= */

    .scene {
      position: relative;

      width: min(1536px, 100vw);
      aspect-ratio: 3 / 2;

      margin: 0 auto;

      overflow: hidden;

      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% 100%;
    }

    body.day .scene {
      background-image:
        url("../assets/background-explore-day.jpg");
    }

    body.night .scene {
      background-image:
        url("../assets/background-explore-night.jpg");
    }

    /* =========================
       Page brand
       ========================= */

    .page-brand {
      position: absolute;

      left: 3.5%;
      top: 3.5%;

      z-index: 30;
    }

    .brand-home {
      display: inline-block;

      color: inherit;
      text-decoration: none;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(18px, 2vw, 30px);

      font-weight: 400;

      line-height: 1.1;

      transition:
        opacity 0.2s ease;
    }

    .page-name {
      margin-top: 4px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(11px, 1.1vw, 16px);

      font-weight: 400;

      line-height: 1.2;

      opacity: 0.75;
    }

    body.day .page-brand {
      color: black;
    }

    body.night .page-brand {
      color: white;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55);
    }

    @media (hover: hover) and (pointer: fine) {
      .brand-home:hover {
        opacity: 0.6;
      }
    }

    /* =========================
       Bottom menu
       ========================= */

    .explore-menu {
      position: absolute;

      left: 50%;
      bottom: 3.2%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    .explore-menu button {
      appearance: none;

      margin: 0;
      padding: 6px 4px;

      border: 0;
      background: transparent;

      font: inherit;
      font-size: clamp(12px, 1.45vw, 22px);
      font-weight: 400;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    body.day .explore-menu button {
      color: black;
    }

    body.night .explore-menu button {
      color: white;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .explore-menu button[aria-pressed="true"] {
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    @media (hover: hover) and (pointer: fine) {
      .explore-menu button:hover {
        opacity: 0.65;
        transform: translateY(-1px);
      }
    }

    /* =========================
       Overlay
       ========================= */

    .overlay {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 7%;

      box-sizing: border-box;

      z-index: 10;

      pointer-events: none;
      opacity: 0;

      transition:
        opacity 0.25s ease;
    }

    .overlay.is-open {
      pointer-events: auto;
      opacity: 1;
    }

    /* =========================
       Content panel
       ========================= */

    .content-panel {
      position: relative;

      width: min(720px, 82%);
      max-height: 68%;

      overflow-y: auto;

      box-sizing: border-box;

      padding:
        clamp(22px, 3vw, 42px);

      border-radius: 14px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        background-color 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease;
    }

    body.day .content-panel {
      background:
        rgba(255, 255, 255, 0.78);

      color: black;

      border:
        1px solid rgba(0, 0, 0, 0.15);
    }

    body.night .content-panel {
      background:
        rgba(0, 0, 0, 0.68);

      color: white;

      border:
        1px solid rgba(255, 255, 255, 0.22);
    }

    /* =========================
       Panel title
       ========================= */

    .panel-title {
      margin:
        0 40px 22px 0;

      font-size:
        clamp(20px, 2vw, 30px);

      font-weight: 400;
    }

    /* =========================
       Content list
       ========================= */

    .content-list {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    .content-list li + li {
      margin-top: 13px;
    }

    .content-list a {
      display: inline-block;

      color: inherit;
      text-decoration: none;

      font-size:
        clamp(13px, 1.25vw, 18px);

      line-height: 1.5;

      transition:
        opacity 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .content-list a:hover {
        opacity: 0.58;
      }
    }

    /* =========================
       Empty state
       ========================= */

    .empty-message {
      margin: 0;

      font-size:
        clamp(13px, 1.15vw, 17px);

      line-height: 1.7;

      opacity: 0.7;
    }

    /* =========================
       Close button
       ========================= */

    .close-panel {
      position: absolute;

      top: 14px;
      right: 16px;

      width: 36px;
      height: 36px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;

      color: inherit;

      font-family:
        Arial,
        sans-serif;

      font-size: 25px;
      font-weight: 300;
      line-height: 1;

      cursor: pointer;

      opacity: 0.65;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .close-panel:hover {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    /* =========================
       Keyboard focus
       ========================= */

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 600px) {

      .page-brand {
        left: 3%;
        top: 3%;
      }

      .brand-home {
        font-size: 18px;
      }

      .page-name {
        font-size: 11px;
      }

      .explore-menu {
        bottom: 2.5%;
      }

      .explore-menu button {
        font-size: 12px;
      }

      .overlay {
        padding:
          10% 5% 14%;
      }

      .content-panel {
        width: 92%;
        max-height: 70%;

        padding:
          22px 20px;
      }

      .panel-title {
        font-size: 19px;
      }

      .content-list a {
        font-size: 14px;
      }
    }

    /* =========================
       Reduced motion
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <!-- =======================
         BranBed / Explore
         ======================= -->

    <header class="page-brand">

      <a
        class="brand-home"
        href="../index.html"
      >
        BranBed
      </a>

      <div class="page-name">
        Explore
      </div>

    </header>

    <!-- =======================
         Floating content window
         ======================= -->

    <div
      class="overlay"
      id="overlay"
      aria-hidden="true"
    >

      <section
        class="content-panel"
        role="dialog"
        aria-modal="false"
        aria-labelledby="panel-title"
      >

        <button
          class="close-panel"
          id="close-panel"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

        <h1
          class="panel-title"
          id="panel-title"
        >
          Voyage
        </h1>

        <div
          id="panel-content"
        >
        </div>

      </section>

    </div>

    <!-- =======================
         Bottom navigation
         ======================= -->

    <nav
      class="explore-menu"
      aria-label="Explore sections"
    >

      <button
        type="button"
        id="voyage-button"
        aria-pressed="false"
      >
        Voyage
      </button>

    </nav>

  </main>

  <script>

    /* =========================
       Day / Night
       ========================= */

    function setTheme() {

      const now =
        new Date();

      const hour =
        now.getHours();

      const isDaytime =
        hour >= 6 &&
        hour < 18;

      document.body.classList.toggle(
        "day",
        isDaytime
      );

      document.body.classList.toggle(
        "night",
        !isDaytime
      );
    }

    setTheme();

    /*
      ページを開いたまま
      06:00 / 18:00 を迎えても
      自動的に切り替える
    */

    setInterval(
      setTheme,
      60 * 1000
    );


    /* =========================
       Voyage contents

       今後の記事追加は
       基本的にここを編集します。
       ========================= */

    const voyageContents = [

      /*
      例:

      {
        title: "Practice",
        href: "./voyage/practice/"
      },

      {
        title: "Ferment",
        href: "./voyage/ferment/"
      },

      {
        title: "Improve",
        href: "./voyage/improve/"
      }
      */

    ];


    /* =========================
       Panel control
       ========================= */

    const overlay =
      document.getElementById(
        "overlay"
      );

    const panelContent =
      document.getElementById(
        "panel-content"
      );

    const closePanelButton =
      document.getElementById(
        "close-panel"
      );

    const voyageButton =
      document.getElementById(
        "voyage-button"
      );


    function renderVoyageContents() {

      panelContent.innerHTML =
        "";

      if (
        voyageContents.length === 0
      ) {

        const message =
          document.createElement(
            "p"
          );

        message.className =
          "empty-message";

        message.textContent =
          "No content yet.";

        panelContent.appendChild(
          message
        );

        return;
      }

      const list =
        document.createElement(
          "ul"
        );

      list.className =
        "content-list";

      voyageContents.forEach(
        item => {

          const listItem =
            document.createElement(
              "li"
            );

          const link =
            document.createElement(
              "a"
            );

          link.href =
            item.href;

          link.textContent =
            item.title;

          listItem.appendChild(
            link
          );

          list.appendChild(
            listItem
          );

        }
      );

      panelContent.appendChild(
        list
      );
    }


    function openPanel() {

      renderVoyageContents();

      overlay.classList.add(
        "is-open"
      );

      overlay.setAttribute(
        "aria-hidden",
        "false"
      );

      voyageButton.setAttribute(
        "aria-pressed",
        "true"
      );
    }


    function closePanel() {

      overlay.classList.remove(
        "is-open"
      );

      overlay.setAttribute(
        "aria-hidden",
        "true"
      );

      voyageButton.setAttribute(
        "aria-pressed",
        "false"
      );
    }


    /* =========================
       Voyage button
       ========================= */

    voyageButton.addEventListener(
      "click",
      () => {

        const isOpen =
          overlay.classList.contains(
            "is-open"
          );

        if (isOpen) {

          closePanel();

        } else {

          openPanel();

        }
      }
    );


    /* =========================
       Close button
       ========================= */

    closePanelButton.addEventListener(
      "click",
      closePanel
    );


    /* =========================
       Escape key
       ========================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlay.classList.contains(
            "is-open"
          )
        ) {

          closePanel();

        }
      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BranBed</title>

  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;

      transition:
        background-color 0.8s ease;
    }

    /* 昼 */
    body.day {
      background-color: white;
    }

    /* 夜 */
    body.night {
      background-color: black;
    }

    /*
      背景画像とリンクをまとめて扱う領域
      PCでは最大1536px程度、
      スマホでは画面幅に合わせて縮小
    */
    .scene {
      position: relative;

      width: min(1536px, 100vw);
      aspect-ratio: 3 / 2;

      margin: 0 auto;

      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% 100%;
    }

    /* 昼背景 */
    body.day .scene {
      background-image: url("./assets/background-day.jpg");
    }

    /* 夜背景 */
    body.night .scene {
      background-image: url("./assets/background-night.jpg");
    }

    /*
      共通リンク設定
    */
    .menu-link {
      position: absolute;

      color: white;
      text-decoration: none;

      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;

      /*
        PCではやや大きめ、
        スマホでは自動縮小
      */
      font-size: clamp(11px, 1.5vw, 22px);

      white-space: nowrap;

      /*
        背景写真の上でも読みやすいように
        ごく薄い影を付与
      */
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .menu-link:hover {
      opacity: 0.75;
      transform: translateY(-1px);
    }

    /*
      ==========================
      メインコンテンツの位置
      ==========================

      ここを調整すれば位置を変更できます。

      left = 左から何%
      top  = 上から何%

      背景画像に対する割合なので、
      画像が縮小されても位置関係は維持されます。
    */

    .observe {
      left: 6%;
      top: 88%;
    }

    .practice {
      left: 16%;
      top: 88%;
    }

    .ferment {
      left: 27%;
      top: 88%;
    }

    .improve {
      left: 37%;
      top: 88%;
    }

    /*
      Fishery Research
      メイン4項目より小さめ
    */
    .fishery {
      left: 6%;
      top: 94%;

      color: #8fd8ff;

      font-size: clamp(9px, 1vw, 15px);

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.6);
    }

    /*
      スマホではタップしやすくするため
      最低限の余白を確保
    */
    @media (max-width: 600px) {
      .menu-link {
        line-height: 1.4;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <a
      class="menu-link observe"
      href="./observe/"
    >
      Observe
    </a>

    <a
      class="menu-link practice"
      href="./practice/"
    >
      Practice
    </a>

    <a
      class="menu-link ferment"
      href="./ferment/"
    >
      Ferment
    </a>

    <a
      class="menu-link improve"
      href="./improve/"
    >
      Improve
    </a>

    <a
      class="menu-link fishery"
      href="https://note.com/branbed"
      target="_blank"
      rel="noopener noreferrer"
    >
      Fishery Research
    </a>

  </main>

  <script>
    function setBackground() {
      const now = new Date();
      const hour = now.getHours();

      const isDaytime = hour >= 6 && hour < 18;

      document.body.classList.toggle("day", isDaytime);
      document.body.classList.toggle("night", !isDaytime);
    }

    // ページを開いた瞬間に判定
    setBackground();

    // 1分ごとに再判定
    // 開きっぱなしでも6:00 / 18:00に自動切替
    setInterval(setBackground, 60 * 1000);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BranBed</title>

  <link rel="icon" type="image/png" href="./assets/favicon.png">
  
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background-repeat: no-repeat;
      background-position: center top;

      transition:
        background-image 0.8s ease,
        background-color 0.8s ease;
    }

    /* 6:00 ～ 17:59 */
    body.day {
      background-color: white;
      background-image: url("./assets/background-day.jpg");

      /*
        元画像: 1536 × 1024 px

        画面幅が1536px以上なら元サイズ固定。
        スマホなど1536px未満なら画面幅まで縮小。
      */
      background-size: min(1536px, 100vw) auto;
    }

    /* 18:00 ～ 5:59 */
    body.night {
      background-color: black;
      background-image: url("./assets/background-night.jpg");

      /*
        元画像: 1535 × 1024 px

        画面幅が1535px以上なら元サイズ固定。
        スマホなど1535px未満なら画面幅まで縮小。
      */
      background-size: min(1535px, 100vw) auto;
    }
  </style>
</head>

<body>

  <script>
    function setBackground() {
      const now = new Date();
      const hour = now.getHours();

      // PC・スマホなど、閲覧端末の現地時間を使用
      const isDaytime = hour >= 6 && hour < 18;

      document.body.classList.toggle("day", isDaytime);
      document.body.classList.toggle("night", !isDaytime);
    }

    // ページを開いた瞬間に判定
    setBackground();

    // 1分ごとに再判定
    // ページを開いたまま6:00 / 18:00を迎えても自動切替
    setInterval(setBackground, 60 * 1000);
  </script>

</body>
</html>

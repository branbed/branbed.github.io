<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BranBed</title>

  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      transition:
        background-color 0.8s ease;
    }

    /* =========================
       Day / Night
       ========================= */

    body.day {
      background-color: white;
    }

    body.night {
      background-color: black;
    }

    /* =========================
       Scene
       =========================

       背景画像とリンクを
       同じ座標系の中に配置します。

       PC:
       元画像サイズ付近まで固定

       スマホ:
       画面幅に合わせて縮小
    */

    .scene {
      position: relative;

      width: min(1536px, 100vw);
      aspect-ratio: 3 / 2;

      margin: 0 auto;

      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% 100%;
    }

    body.day .scene {
      background-image:
        url("./assets/background-day.jpg");
    }

    body.night .scene {
      background-image:
        url("./assets/background-night.jpg");
    }

    /* =========================
       Main links
       ========================= */

    .main-link {
      position: absolute;

      color: white;
      text-decoration: none;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-weight: 400;

      /*
        背景画像の縮小に合わせて
        文字サイズも変化
      */
      font-size:
        clamp(12px, 1.55vw, 23px);

      white-space: nowrap;

      /*
        背景上でも少し読みやすくする
      */
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .main-link:hover {
        opacity: 0.72;
        transform: translateY(-1px);
      }
    }

    /* =========================
       Main link positions
       =========================

       位置調整はここだけ触ればOKです。

       left:
       背景画像の左から何%

       top:
       背景画像の上から何%
    */

    .observe {
      left: 7%;
      top: 80%;
    }

    .explore {
      left: 7%;
      top: 86%;
    }

    /* =========================
       Cabin
       =========================

       noteへの外部リンク。

       メインリンクより小さく、
       少し離して配置します。
    */

    .cabin {
      position: absolute;

      left: 7%;
      top: 94%;

      color: #8fd8ff;
      text-decoration: none;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-weight: 400;

      font-size:
        clamp(9px, 1vw, 15px);

      white-space: nowrap;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.6);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .cabin:hover {
        opacity: 0.72;
        transform: translateY(-1px);
      }
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 600px) {
      .main-link,
      .cabin {
        line-height: 1.4;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <a
      class="main-link observe"
      href="./observe/index.html"
    >
      Observe
    </a>

    <a
      class="main-link explore"
      href="./explore/index.html"
    >
      Explore
    </a>

    <a
      class="cabin"
      href="https://note.com/branbed"
      target="_blank"
      rel="noopener noreferrer"
    >
      Cabin
    </a>

  </main>

  <script>
    function setBackground() {
      const now = new Date();

      /*
        閲覧しているPC・スマホの
        現地時間を使用
      */
      const hour = now.getHours();

      /*
        06:00 - 17:59 : Day
        18:00 - 05:59 : Night
      */
      const isDaytime =
        hour >= 6 && hour < 18;

      document.body.classList.toggle(
        "day",
        isDaytime
      );

      document.body.classList.toggle(
        "night",
        !isDaytime
      );
    }

    /*
      ページを開いた瞬間に判定
    */
    setBackground();

    /*
      1分ごとに再判定。

      ページを開いたまま
      06:00 / 18:00 を迎えても
      自動的に切り替わります。
    */
    setInterval(
      setBackground,
      60 * 1000
    );
  </script>

</body>
</html>

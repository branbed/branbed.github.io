<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BranBed</title>

  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      transition:
        background-color 0.8s ease,
        color 0.8s ease;
    }

    /* =========================
       Day / Night
       ========================= */

    body.day {
      background-color: #ffffff;
      color: #111111;
    }

    body.night {
      background-color: #000000;
      color: #ffffff;
    }

    /* =========================
       Scene
       1672 × 941

       画像をブラウザ内に
       必ず全部収める。

       縦長画面:
       横幅が基準

       横長画面:
       縦幅が基準
       ========================= */

    .scene {
      position: relative;

      width: min(
        100vw,
        calc(100vh * 1672 / 941)
      );

      height: min(
        100vh,
        calc(100vw * 941 / 1672)
      );

      flex: 0 0 auto;

      overflow: hidden;

      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
    }

    body.day .scene {
      background-image:
        url("./assets/background-top-day.jpg");
    }

    body.night .scene {
      background-image:
        url("./assets/background-top-night.jpg");
    }

    /* =========================
       Navigation hotspots
       ========================= */

    .world-link {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;

      z-index: 5;
    }

    /* Mountain */
    .climb-link {
      left: 0%;
      top: 0%;

      width: 44%;
      height: 77%;
    }

    /* Sea */
    .dive-link {
      left: 44%;
      top: 0%;

      width: 56%;
      height: 77%;
    }

    /* Table */
    .stay-link {
      left: 0%;
      top: 77%;

      width: 100%;
      height: 23%;
    }

    /* =========================
       Hover labels
       ========================= */

    .world-label {
      opacity: 0;

      padding:
        clamp(5px, 0.5vw, 8px)
        clamp(10px, 1vw, 16px);

      border-radius: 5px;

      color: white;

      background:
        rgba(0, 0, 0, 0.42);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(14px, 1.5vw, 24px);

      font-weight: 400;

      letter-spacing: 0.03em;

      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.7);

      pointer-events: none;

      transform: translateY(4px);

      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    @media (hover: hover) and (pointer: fine) {

      .world-link:hover .world-label {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       BranBed favicon menu
       ========================= */

    .brand-menu {
      position: absolute;

      left: 2%;
      bottom: 2%;

      z-index: 30;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand-popup {
      position: absolute;

      left: 0;
      bottom: calc(100% + 8px);

      min-width: 105px;

      padding: 8px 0;

      border-radius: 8px;

      opacity: 0;
      visibility: hidden;

      transform: translateY(6px);

      transition:
        opacity 0.18s ease,
        visibility 0.18s ease,
        transform 0.18s ease;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      overflow: hidden;
    }

    body.day .brand-popup {
      background:
        rgba(255, 255, 255, 0.84);

      border:
        1px solid rgba(0, 0, 0, 0.14);
    }

    body.night .brand-popup {
      background:
        rgba(0, 0, 0, 0.76);

      border:
        1px solid rgba(255, 255, 255, 0.20);
    }

    .brand-menu:hover .brand-popup,
    .brand-menu:focus-within .brand-popup {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    .brand-popup a {
      display: block;

      padding: 6px 14px;

      color: inherit;

      text-decoration: none;

      font-size:
        clamp(12px, 1vw, 15px);

      line-height: 1.3;

      white-space: nowrap;
    }

    body.day .brand-popup a:hover {
      background:
        rgba(0, 0, 0, 0.08);
    }

    body.night .brand-popup a:hover {
      background:
        rgba(255, 255, 255, 0.12);
    }

    .brand-icon {
      display: block;

      width:
        clamp(32px, 3vw, 46px);

      height:
        clamp(32px, 3vw, 46px);

      object-fit: cover;

      cursor: pointer;

      border-radius: 2px;

      transition:
        opacity 0.18s ease;
    }

    .brand-menu:hover .brand-icon {
      opacity: 0.82;
    }

    /* =========================
       Copyright
       ========================= */

    .copyright {
      position: absolute;

      right: 2%;
      bottom: 2%;

      z-index: 20;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(9px, 0.8vw, 12px);

      white-space: nowrap;

      pointer-events: none;
    }

    body.day .copyright {
      color:
        rgba(255, 255, 255, 0.78);

      text-shadow:
        0 1px 2px
        rgba(0, 0, 0, 0.70);
    }

    body.night .copyright {
      color:
        rgba(255, 255, 255, 0.72);

      text-shadow:
        0 1px 2px
        rgba(0, 0, 0, 0.80);
    }

    /* =========================
       Focus
       ========================= */

    a:focus-visible,
    .brand-icon:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    /* =========================
       Reduced motion
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <!-- Mountain → Climb -->

    <a
      class="world-link climb-link"
      href="./climb/index.html"
      aria-label="Climb"
    >
      <span class="world-label">
        Climb
      </span>
    </a>

    <!-- Sea → Dive -->

    <a
      class="world-link dive-link"
      href="./dive/index.html"
      aria-label="Dive"
    >
      <span class="world-label">
        Dive
      </span>
    </a>

    <!-- Table → Stay -->

    <a
      class="world-link stay-link"
      href="./stay/index.html"
      aria-label="Stay"
    >
      <span class="world-label">
        Stay
      </span>
    </a>

    <!-- BranBed menu -->

    <div class="brand-menu">

      <nav
        class="brand-popup"
        aria-label="BranBed navigation"
      >
        <a href="./index.html">
          Top
        </a>

        <a href="./climb/index.html">
          Climb
        </a>

        <a href="./stay/index.html">
          Stay
        </a>

        <a href="./dive/index.html">
          Dive
        </a>
      </nav>

      <img
        class="brand-icon"
        src="./assets/favicon.png"
        alt="BranBed"
        tabindex="0"
      >

    </div>

    <!-- Copyright -->

    <div class="copyright">
      ⓒ BranBed 2026
    </div>

  </main>

  <script>
    function setTheme() {

      const hour =
        new Date().getHours();

      const isDaytime =
        hour >= 6 &&
        hour < 18;

      document.body.classList.toggle(
        "day",
        isDaytime
      );

      document.body.classList.toggle(
        "night",
        !isDaytime
      );
    }

    setTheme();

    setInterval(
      setTheme,
      60 * 1000
    );
  </script>

</body>
</html>

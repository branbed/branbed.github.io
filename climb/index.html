<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Climb | BranBed</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    body.day {
      background-color: #ffffff;
      color: #111111;
    }

    body.night {
      background-color: #000000;
      color: #ffffff;
    }

    /* =========================
       Scene
       ========================= */

    .scene {
      position: relative;

      width: min(
        100vw,
        calc(100vh * 1672 / 941)
      );

      height: min(
        100vh,
        calc(100vw * 941 / 1672)
      );

      flex: 0 0 auto;

      overflow: hidden;

      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
    }

    body.day .scene {
      background-image:
        url("../assets/background-climb-day.jpg");
    }

    body.night .scene {
      background-image:
        url("../assets/background-climb-night.jpg");
    }

    /* =========================
       Whole scene trigger
       ========================= */

    .dashboard-trigger {
      position: absolute;

      inset: 0;

      z-index: 2;

      cursor: pointer;
    }

    .scene.dashboard-open
    .dashboard-trigger {
      pointer-events: none;
    }

    /* =========================
       Dashboard panels
       ========================= */

    .dashboard-panel {
      position: absolute;

      top: 0;
      height: 100%;

      box-sizing: border-box;

      padding:
        clamp(44px, 4vw, 70px)
        clamp(20px, 2.4vw, 38px)
        clamp(30px, 3vw, 48px);

      overflow-y: auto;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        opacity 0.22s ease,
        visibility 0.22s ease,
        transform 0.22s ease;

      z-index: 20;
    }

    body.day .dashboard-panel {
      background:
        rgba(255, 255, 255, 0.56);

      color: #111111;
    }

    body.night .dashboard-panel {
      background:
        rgba(0, 0, 0, 0.48);

      color: #ffffff;
    }

    .scene.dashboard-open
    .dashboard-panel {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;

      transform: translateX(0);
    }

    .left-panel {
      left: 0;

      width: 30%;

      transform:
        translateX(-4%);

      border-right:
        1px solid rgba(128,128,128,0.25);
    }

    .center-panel {
      left: 30%;

      width: 30%;

      transform:
        translateY(-2%);

      border-right:
        1px solid rgba(128,128,128,0.25);
    }

    .weather-panel {
      left: 60%;

      width: 40%;

      transform:
        translateX(4%);
    }

    /* =========================
       Close buttons
       ========================= */

    .close-button {
      position: absolute;

      top: 14px;
      right: 16px;

      width: 36px;
      height: 36px;

      padding: 0;

      border: 0;

      background: transparent;
      color: inherit;

      font-family:
        Arial,
        sans-serif;

      font-size: 25px;
      font-weight: 300;

      cursor: pointer;

      opacity: 0.62;
    }

    .close-button:hover {
      opacity: 1;
    }

    /* =========================
       Metrics
       ========================= */

    .metric {
      margin-bottom:
        clamp(18px, 2vh, 30px);
    }

    .metric-icon {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 34px;

      font-size:
        clamp(20px, 2vw, 30px);

      line-height: 1;

      cursor: default;
    }

    /* Tooltip */

    .metric-icon::after {
      content:
        attr(data-tooltip);

      position: absolute;

      left: 50%;
      bottom:
        calc(100% + 8px);

      transform:
        translateX(-50%);

      padding:
        4px 8px;

      border-radius: 4px;

      background:
        rgba(0, 0, 0, 0.75);

      color: #ffffff;

      font-family:
        Arial,
        sans-serif;

      font-size:
        11px;

      line-height: 1.2;

      white-space: nowrap;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.14s ease,
        visibility 0.14s ease;

      z-index: 60;
    }

    .metric-icon:hover::after {
      opacity: 1;
      visibility: visible;
    }

    .metric-value {
      margin-top: 8px;

      font-size:
        clamp(14px, 1.25vw, 20px);

      line-height: 1.45;
    }

    .metric-value.multi {
      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    /* =========================
       Weather
       ========================= */

    .weather-content {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      min-height: 55%;
    }

    .weather-title {
      font-size:
        clamp(14px, 1.3vw, 20px);

      margin-bottom:
        14px;
    }

    .weather-value {
      font-size:
        clamp(24px, 2.6vw, 42px);
    }

    /* =========================
       BranBed favicon
       ========================= */

    .brand-menu {
      position: absolute;

      left: 2%;
      bottom: 2%;

      z-index: 50;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.18s ease,
        visibility 0.18s ease;
    }

    .scene.dashboard-open
    .brand-menu {
      opacity: 0;
      visibility: hidden;

      pointer-events: none;
    }

    .brand-popup {
      position: absolute;

      left: 0;
      bottom:
        calc(100% + 8px);

      min-width: 105px;

      padding: 8px 0;

      border-radius: 8px;

      opacity: 0;
      visibility: hidden;

      transform:
        translateY(6px);

      transition:
        opacity 0.18s ease,
        visibility 0.18s ease,
        transform 0.18s ease;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    body.day .brand-popup {
      background:
        rgba(255,255,255,0.84);
    }

    body.night .brand-popup {
      background:
        rgba(0,0,0,0.76);
    }

    .brand-menu:hover
    .brand-popup,
    .brand-menu:focus-within
    .brand-popup {
      opacity: 1;
      visibility: visible;

      transform:
        translateY(0);
    }

    .brand-popup a {
      display: block;

      padding: 6px 14px;

      color: inherit;

      text-decoration: none;

      font-size:
        clamp(12px,1vw,15px);

      white-space: nowrap;
    }

    .brand-icon {
      display: block;

      width:
        clamp(32px,3vw,46px);

      height:
        clamp(32px,3vw,46px);

      object-fit: cover;

      cursor: pointer;
    }

    /* =========================
       Copyright
       ========================= */

    .copyright {
      position: absolute;

      right: 2%;
      bottom: 2%;

      z-index: 30;

      font-size:
        clamp(9px,0.8vw,12px);

      white-space: nowrap;

      pointer-events: none;
    }

    body.day .copyright {
      color:
        rgba(255,255,255,0.78);

      text-shadow:
        0 1px 2px rgba(0,0,0,0.70);
    }

    body.night .copyright {
      color:
        rgba(255,255,255,0.72);

      text-shadow:
        0 1px 2px rgba(0,0,0,0.80);
    }
  </style>
</head>

<body>

  <main
    class="scene"
    id="scene"
  >

    <!-- Whole background click -->

    <div
      class="dashboard-trigger"
      id="dashboard-trigger"
      role="button"
      tabindex="0"
      aria-label="Open Climb dashboard"
    >
    </div>

    <!-- =======================
         Left 30%
         ======================= -->

    <section
      class="dashboard-panel left-panel"
    >

      <button
        class="close-button"
        type="button"
        aria-label="Close dashboard"
      >
        ×
      </button>

      <!-- Altitude -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Altitude"
        >
          △
        </div>

        <div
          class="metric-value"
          id="altitude-value"
        >
          -
        </div>

      </div>

      <!-- Slope -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Slope"
        >
          /
        </div>

        <div
          class="metric-value"
          id="slope-value"
        >
          -
        </div>

      </div>

      <!-- Lead -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Lead"
        >
          ○
        </div>

        <div
          class="metric-value multi"
        >
          <span id="lead-1-value">-</span>
          <span id="lead-2-value">-</span>
          <span id="lead-3-value">-</span>
        </div>

      </div>

      <!-- Piton -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Piton"
        >
          —
        </div>

        <div
          class="metric-value multi"
        >
          <span id="piton-1-value">-</span>
          <span id="piton-2-value">-</span>
        </div>

      </div>

      <!-- Carabiner -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Carabiner"
        >
          ⊂
        </div>

        <div
          class="metric-value"
          id="carabiner-value"
        >
          -
        </div>

      </div>

      <!-- Belay -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Belay"
        >
          ｜
        </div>

        <div
          class="metric-value"
          id="belay-value"
        >
          -
        </div>

      </div>

    </section>

    <!-- =======================
         Center 30%
         ======================= -->

    <section
      class="dashboard-panel center-panel"
    >

      <button
        class="close-button"
        type="button"
        aria-label="Close dashboard"
      >
        ×
      </button>

      <!-- North -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="North"
        >
          ↑
        </div>

        <div
          class="metric-value"
          id="north-value"
        >
          -
        </div>

      </div>

      <!-- Beta -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Beta"
        >
          β
        </div>

        <div
          class="metric-value"
          id="beta-value"
        >
          -
        </div>

      </div>

      <!-- Ridge -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Ridge"
        >
          ⌁
        </div>

        <div
          class="metric-value"
          id="ridge-value"
        >
          -
        </div>

      </div>

      <!-- Haven -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Haven"
        >
          ◇
        </div>

        <div
          class="metric-value"
          id="haven-value"
        >
          -
        </div>

      </div>

      <!-- Carry -->

      <div class="metric">

        <div
          class="metric-icon"
          data-tooltip="Carry"
        >
          ↗
        </div>

        <div
          class="metric-value"
          id="carry-value"
        >
          -
        </div>

      </div>

    </section>

    <!-- =======================
         Right 40%
         ======================= -->

    <section
      class="dashboard-panel weather-panel"
    >

      <button
        class="close-button"
        type="button"
        aria-label="Close dashboard"
      >
        ×
      </button>

      <div class="weather-content">

        <div class="weather-title">
          Weather
        </div>

        <div
          class="weather-value"
          id="weather-value"
        >
          Clear
        </div>

      </div>

    </section>

    <!-- =======================
         BranBed navigation
         ======================= -->

    <div class="brand-menu">

      <nav
        class="brand-popup"
        aria-label="BranBed navigation"
      >
        <a href="../index.html">Top</a>
        <a href="./index.html">Climb</a>
        <a href="../stay/index.html">Stay</a>
        <a href="../dive/index.html">Dive</a>
      </nav>

      <img
        class="brand-icon"
        src="../assets/favicon.png"
        alt="BranBed"
        tabindex="0"
      >

    </div>

    <div class="copyright">
      ⓒ BranBed 2026
    </div>

  </main>

  <script>
    const scene =
      document.getElementById("scene");

    const dashboardTrigger =
      document.getElementById(
        "dashboard-trigger"
      );

    const closeButtons =
      document.querySelectorAll(
        ".close-button"
      );


    /* =========================
       Day / Night
       ========================= */

    function setTheme() {
      const hour =
        new Date().getHours();

      const isDaytime =
        hour >= 6 &&
        hour < 18;

      document.body.classList.toggle(
        "day",
        isDaytime
      );

      document.body.classList.toggle(
        "night",
        !isDaytime
      );
    }

    setTheme();

    setInterval(
      setTheme,
      60 * 1000
    );


    /* =========================
       Dashboard
       ========================= */

    function openDashboard() {
      scene.classList.add(
        "dashboard-open"
      );
    }


    function closeDashboard() {
      scene.classList.remove(
        "dashboard-open"
      );
    }


    dashboardTrigger.addEventListener(
      "click",
      openDashboard
    );


    dashboardTrigger.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          event.preventDefault();

          openDashboard();
        }
      }
    );


    closeButtons.forEach(
      button => {
        button.addEventListener(
          "click",
          closeDashboard
        );
      }
    );


    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Escape" &&
          scene.classList.contains(
            "dashboard-open"
          )
        ) {
          closeDashboard();
        }
      }
    );


    /* =========================
       Future Cloudflare API

       Example:

       document.getElementById(
         "altitude-value"
       ).textContent = data.altitude;

       ========================= */
  </script>

</body>
</html>
